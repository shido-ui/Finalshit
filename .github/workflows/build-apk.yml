name: Build FocusForge APK

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL compiled into the APK"
        required: false
        default: "http://localhost:8080"
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build installable debug APK
        run: |
          gradle :app:assembleDebug \
            -Pfocusforge.backendUrl="${{ inputs.backend_url || 'http://localhost:8080' }}"

      - name: Build release APK
        run: |
          gradle :app:assembleRelease \
            -Pfocusforge.backendUrl="${{ inputs.backend_url || 'http://localhost:8080' }}"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusForge-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
